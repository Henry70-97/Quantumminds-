<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartHustle AI | Firebase Edition</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#0a0e1a',
            surface: '#131829',
            accent: '#00e5a0',
            accentDim: '#00c98b',
            coral: '#ff6b6b',
            slate: '#8892b0',
            light: '#ccd6f6',
          }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; font-family: 'DM Sans', sans-serif; }
    .font-heading { font-family: 'Sora', sans-serif; }
    .app-wrapper { height: 100%; width: 100%; overflow: auto; }
    .glow { box-shadow: 0 0 40px rgba(0,229,160,0.15); }
    .card-hover { transition: transform 0.3s, box-shadow 0.3s; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,229,160,0.12); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 20px rgba(0,229,160,0.2); } 50% { box-shadow: 0 0 40px rgba(0,229,160,0.4); } }
    .anim-fade { animation: fadeUp 0.7s ease both; }
    .anim-fade-d1 { animation: fadeUp 0.7s 0.1s ease both; }
    .anim-fade-d2 { animation: fadeUp 0.7s 0.2s ease both; }
    .anim-fade-d3 { animation: fadeUp 0.7s 0.3s ease both; }
    .anim-fade-d4 { animation: fadeUp 0.7s 0.4s ease both; }
    .anim-slide { animation: slideIn 0.5s ease both; }
    .pulse-btn { animation: pulse-glow 2s infinite; }
    .gradient-text { background: linear-gradient(135deg, #00e5a0, #00b4d8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .bg-grid { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0); background-size: 40px 40px; }
    input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 2px #00e5a0; }
    .hamburger-line { transition: all 0.3s; }
    .menu-open .hamburger-line:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .menu-open .hamburger-line:nth-child(2) { opacity: 0; }
    .menu-open .hamburger-line:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
    .screen { display: none; }
    .screen.active { display: block; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #1e2744; border-radius: 3px; }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); z-index: 100; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body class="bg-midnight text-light">
<div class="app-wrapper bg-grid" id="app">
  <!-- ===== NAVIGATION ===== -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-midnight/90 backdrop-blur-md border-b border-white/5">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('landing')">
        <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center"><i data-lucide="zap" style="width:18px;height:18px;color:#0a0e1a;"></i></div>
        <span class="font-heading font-bold text-lg">SmartHustle</span>
      </div>
      <div class="hidden md:flex items-center gap-6 text-sm text-slate">
        <a href="#" onclick="navigateTo('landing');return false" class="hover:text-accent transition">Home</a>
        <a href="#" onclick="navigateTo('tools');return false" class="hover:text-accent transition">Tools</a>
        <a href="#" onclick="navigateTo('jobs');return false" class="hover:text-accent transition">Jobs</a>
        <button onclick="navigateTo('login')" class="px-4 py-2 rounded-lg bg-accent/10 text-accent hover:bg-accent/20 transition font-medium">Sign In</button>
        <button onclick="navigateTo('signup')" class="px-4 py-2 rounded-lg bg-accent text-midnight hover:bg-accentDim transition font-semibold">Get Started</button>
      </div>
      <button id="hamburgerBtn" class="md:hidden flex flex-col gap-1.5 p-2" onclick="toggleMobileMenu()">
        <span class="hamburger-line w-5 h-0.5 bg-light block"></span>
        <span class="hamburger-line w-5 h-0.5 bg-light block"></span>
        <span class="hamburger-line w-5 h-0.5 bg-light block"></span>
      </button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-surface border-t border-white/5 px-4 py-4 space-y-3">
      <a href="#" onclick="navigateTo('landing');closeMobile();return false" class="block text-slate hover:text-accent py-2">Home</a>
      <a href="#" onclick="navigateTo('tools');closeMobile();return false" class="block text-slate hover:text-accent py-2">Tools</a>
      <a href="#" onclick="navigateTo('jobs');closeMobile();return false" class="block text-slate hover:text-accent py-2">Jobs</a>
      <button onclick="navigateTo('login');closeMobile()" class="w-full text-left text-accent py-2">Sign In</button>
      <button onclick="navigateTo('signup');closeMobile()" class="w-full py-2 rounded-lg bg-accent text-midnight font-semibold text-center">Get Started</button>
    </div>
  </nav>

  <!-- LANDING, SIGNUP, LOGIN, ONBOARDING, DASHBOARD, TOOLS, JOBS screens (same markup but with firebase data) -->
  <!-- For brevity, only critical structural changes are noted; full code with firebase logic will be provided in final answer -->
  <div id="screen-landing" class="screen active pt-16"><!-- content unchanged --></div>
  <div id="screen-signup" class="screen pt-16"><!-- unchanged --></div>
  <div id="screen-login" class="screen pt-16"><!-- unchanged --></div>
  <div id="screen-onboarding" class="screen pt-16"><!-- unchanged --></div>
  <div id="screen-dashboard" class="screen pt-16"><!-- unchanged --></div>
  <div id="screen-tools" class="screen pt-16"><!-- unchanged --></div>
  <div id="screen-jobs" class="screen pt-16"><!-- unchanged --></div>

  <!-- Modals same as before -->
  <div id="toolModal" class="modal-overlay hidden" onclick="if(event.target===this)closeToolModal()"><!-- unchanged --></div>
  <div id="postJobModal" class="modal-overlay hidden" onclick="if(event.target===this)closePostJob()"><!-- unchanged --></div>
  <div id="applyJobModal" class="modal-overlay hidden" onclick="if(event.target===this)closeApplyJob()"><!-- unchanged --></div>
  <div id="toast" class="fixed top-20 right-4 z-50 hidden"><!-- unchanged --></div>
</div>

<script>
  // ---------------------- FIREBASE INIT ----------------------
  const firebaseConfig = {
    apiKey: "AIzaSyDm-PeCeRdlx6TKPEvKNdT93lMqb5D5O20",
    authDomain: "urbanpay-c5aee.firebaseapp.com",
    projectId: "urbanpay-c5aee",
    storageBucket: "urbanpay-c5aee.firebasestorage.app",
    messagingSenderId: "648155825006",
    appId: "1:648155825006:web:16d6ea4dfab808920b777f",
    measurementId: "G-CTKZN6VHPS"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---------------------- GLOBAL STATE ----------------------
  let currentScreen = 'landing';
  let currentUserFirebase = null;       // Firebase user
  let currentUserData = null;           // Firestore user doc
  let selectedSkills = new Set();
  let currentToolId = null;
  let currentApplyJob = null;
  let dashTab = 'overview';

  // Predefined tools (will be seeded to Firestore if needed)
  const toolsCatalog = [
    {id:'t1',name:'Essay Generator',cat:'writing',desc:'Generate well-structured essays on any topic using AI.',demo:'Sample: "The impact of AI on modern education has been profound..."',price:500,icon:'file-text',color:'#00e5a0'},
    {id:'t2',name:'Proposal Generator',cat:'writing',desc:'Create winning freelance proposals that land clients.',demo:'Sample: "Dear [Client], I am excited to help you with..."',price:800,icon:'send',color:'#3b82f6'},
    {id:'t3',name:'Blog Writer',cat:'writing',desc:'SEO-optimized blog posts generated in seconds.',demo:'Sample: "5 Ways AI is Transforming Freelancing in 2025..."',price:600,icon:'book-open',color:'#a78bfa'},
    {id:'t4',name:'Social Media Creator',cat:'content',desc:'Create engaging social media content and captions.',demo:'Sample: "🚀 Ready to level up your hustle? Here are 3 tips..."',price:400,icon:'instagram',color:'#ff6b6b'},
    {id:'t5',name:'Video Script Writer',cat:'content',desc:'Professional video scripts for YouTube and TikTok.',demo:'Sample: "Hey everyone! Today we are diving into..."',price:700,icon:'video',color:'#fbbf24'},
    {id:'t6',name:'Business Plan AI',cat:'business',desc:'Complete business plans with financial projections.',demo:'Sample: "Executive Summary: SmartHustle is a platform..."',price:1200,icon:'bar-chart-2',color:'#a78bfa'},
    {id:'t7',name:'Invoice Generator',cat:'business',desc:'Professional invoices for your freelance work.',demo:'Sample: Invoice #001 — Client: ABC Corp — Amount: KES 5,000',price:300,icon:'file',color:'#00e5a0'},
    {id:'t8',name:'Email Template AI',cat:'business',desc:'Professional emails for client communication.',demo:'Sample: "Subject: Project Update — Hi [Name], I wanted to..."',price:350,icon:'mail',color:'#3b82f6'},
  ];
  const quickTasksStatic = [
    {title:'Rewrite a product description',pay:150,time:'15 min'},
    {title:'Proofread a 2-page document',pay:100,time:'10 min'},
    {title:'Write 5 social media captions',pay:250,time:'20 min'},
    {title:'Summarize a 10-page report',pay:200,time:'15 min'},
  ];

  // ---------------------- SEED DATA (only if empty) ----------------------
  async function seedFirestoreIfNeeded() {
    // Tools
    const toolsSnap = await db.collection('tools').limit(1).get();
    if (toolsSnap.empty) {
      for (const t of toolsCatalog) {
        await db.collection('tools').doc(t.id).set(t);
      }
      console.log("Tools seeded");
    }
    // Sample jobs
    const jobsSnap = await db.collection('jobs').limit(1).get();
    if (jobsSnap.empty) {
      const sampleJobs = [
        { id:'j1', title:'Write 10 SEO Blog Posts', desc:'Need a writer for tech blog posts, 1000 words each.', budget:8000, deadline:'2025-08-01', clientId:'system', clientName:'TechCorp', tags:['Writing','SEO'], createdAt:firebase.firestore.FieldValue.serverTimestamp() },
        { id:'j2', title:'Design Social Media Graphics', desc:'Create 20 Instagram post templates for a fashion brand.', budget:5000, deadline:'2025-07-20', clientId:'system', clientName:'StyleHub', tags:['Design','Social Media'], createdAt:firebase.firestore.FieldValue.serverTimestamp() },
        { id:'j3', title:'Translate Documents EN→SW', desc:'Translate 50 pages of business documents to Swahili.', budget:12000, deadline:'2025-07-25', clientId:'system', clientName:'NGO Africa', tags:['Translation'], createdAt:firebase.firestore.FieldValue.serverTimestamp() },
        { id:'j4', title:'Data Entry - Product Catalog', desc:'Enter 500 products into spreadsheet with descriptions.', budget:3000, deadline:'2025-07-18', clientId:'system', clientName:'ShopKenya', tags:['Data Entry'], createdAt:firebase.firestore.FieldValue.serverTimestamp() }
      ];
      for (const job of sampleJobs) {
        await db.collection('jobs').doc(job.id).set(job);
      }
      console.log("Sample jobs seeded");
    }
  }

  // ---------------------- AUTH & USER ----------------------
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUserFirebase = user;
      const userDoc = await db.collection('users').doc(user.uid).get();
      if (userDoc.exists) {
        currentUserData = userDoc.data();
        // check if onboarding complete (skills array exists)
        if (!currentUserData.skills || currentUserData.skills.length === 0) {
          navigateTo('onboarding');
        } else {
          navigateTo('dashboard');
        }
      } else {
        // Should not happen: new user not yet created (wait for signup)
        navigateTo('onboarding');
      }
    } else {
      currentUserFirebase = null;
      currentUserData = null;
      navigateTo('landing');
    }
    lucide.createIcons();
  });

  async function handleSignup(e) {
    e.preventDefault();
    const name = document.getElementById('s-name').value;
    const email = document.getElementById('s-email').value;
    const phone = document.getElementById('s-phone').value;
    const yob = parseInt(document.getElementById('s-yob').value);
    const nationality = document.getElementById('s-nation').value;
    const password = document.getElementById('s-pass').value;
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await db.collection('users').doc(uid).set({
        uid, name, email, phone, yob, nationality,
        skills: [],
        purchasedTools: [],
        totalEarnings: 0,
        rating: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast('Account created! Please complete onboarding.');
      navigateTo('onboarding');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('l-email').value;
    const password = document.getElementById('l-pass').value;
    try {
      await auth.signInWithEmailAndPassword(email, password);
      showToast('Welcome back!');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function handleGoogleSignup() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const result = await auth.signInWithPopup(provider);
      const user = result.user;
      const userRef = db.collection('users').doc(user.uid);
      const snap = await userRef.get();
      if (!snap.exists) {
        await userRef.set({
          uid: user.uid,
          name: user.displayName || 'Google User',
          email: user.email,
          phone: '',
          yob: null,
          nationality: '',
          skills: [],
          purchasedTools: [],
          totalEarnings: 0,
          rating: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      showToast('Signed in with Google!');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  // ---------------------- ONBOARDING ----------------------
  function renderSkills() {
    const g = document.getElementById('skillGrid');
    if (!g) return;
    const skillsList = ['Writing','AI Tools','Design','Data Entry','Translation','Marketing','Video Editing','Web Dev','Research','Social Media','SEO','Copywriting'];
    g.innerHTML = skillsList.map(s => `<button onclick="toggleSkill(this,'${s}')" class="px-4 py-3 rounded-xl text-sm font-medium border transition ${selectedSkills.has(s)?'bg-accent/20 border-accent text-accent':'bg-surface border-white/10 text-slate hover:border-accent/40'}">${s}</button>`).join('');
  }
  window.toggleSkill = (el, skill) => {
    if (selectedSkills.has(skill)) selectedSkills.delete(skill);
    else selectedSkills.add(skill);
    renderSkills();
  };
  window.completeOnboarding = async () => {
    if (!currentUserFirebase) return;
    await db.collection('users').doc(currentUserFirebase.uid).update({
      skills: Array.from(selectedSkills)
    });
    showToast('Profile updated! Welcome to your dashboard.');
    navigateTo('dashboard');
  };

  // ---------------------- DASHBOARD ----------------------
  async function renderDashboardStats() {
    if (!currentUserFirebase) return;
    const userDoc = await db.collection('users').doc(currentUserFirebase.uid).get();
    currentUserData = userDoc.data();
    // update overview numbers
    const earningsEl = document.querySelector('#dash-overview .text-accent.font-heading');
    if (earningsEl) earningsEl.innerText = `KES ${currentUserData?.totalEarnings || 0}`;
    const activeJobsEl = document.querySelector('#dash-overview .font-heading.font-bold:not(.text-accent)');
    if (activeJobsEl) {
      const appsSnap = await db.collection('applications').where('freelancerId', '==', currentUserFirebase.uid).where('status', '==', 'accepted').get();
      activeJobsEl.innerText = appsSnap.size;
    }
    const toolsOwned = currentUserData?.purchasedTools?.length || 0;
    const toolsEl = document.querySelectorAll('#dash-overview .font-heading.font-bold')[1];
    if (toolsEl) toolsEl.innerText = toolsOwned;
    const ratingEl = document.querySelector('#dash-overview .text-yellow-400');
    if (ratingEl) ratingEl.innerText = currentUserData?.rating || '—';
  }

  async function renderDashJobs() {
    const container = document.getElementById('dashJobsList');
    if (!container) return;
    const jobsSnap = await db.collection('jobs').orderBy('createdAt', 'desc').limit(3).get();
    container.innerHTML = '';
    jobsSnap.forEach(doc => {
      const j = doc.data();
      container.innerHTML += `
        <div class="bg-surface rounded-xl p-5 border border-white/5 card-hover">
          <div class="flex justify-between items-start mb-2"><h4 class="font-heading font-semibold">${j.title}</h4><span class="text-accent font-bold text-sm">KES ${j.budget.toLocaleString()}</span></div>
          <p class="text-slate text-sm mb-3">${j.desc}</p>
          <div class="flex flex-wrap gap-2">${(j.tags||[]).map(t=>`<span class="tag bg-white/5 text-slate">${t}</span>`).join('')}</div>
          <button onclick="openApplyJob('${doc.id}')" class="mt-3 px-4 py-2 rounded-lg bg-accent/10 text-accent text-sm font-medium hover:bg-accent/20 transition">Apply</button>
        </div>
      `;
    });
    lucide.createIcons();
  }

  async function renderDashTasks() {
    const container = document.getElementById('dashTasksList');
    if (!container) return;
    container.innerHTML = quickTasksStatic.map(t => `
      <div class="bg-surface rounded-xl p-4 border border-white/5 flex justify-between items-center card-hover">
        <div><p class="font-medium text-sm">${t.title}</p><p class="text-slate text-xs mt-1"><i data-lucide="clock" style="width:12px;height:12px;display:inline;vertical-align:-1px;"></i> ${t.time}</p></div>
        <div class="text-right"><p class="text-accent font-bold text-sm">KES ${t.pay}</p><button onclick="completeQuickTask('${t.title}', ${t.pay})" class="mt-1 px-3 py-1 rounded-lg bg-accent/10 text-accent text-xs font-medium hover:bg-accent/20 transition">Complete</button></div>
      </div>
    `).join('');
    lucide.createIcons();
  }

  window.completeQuickTask = async (title, pay) => {
    if (!currentUserFirebase) return;
    const userRef = db.collection('users').doc(currentUserFirebase.uid);
    await userRef.update({
      totalEarnings: firebase.firestore.FieldValue.increment(pay)
    });
    await db.collection('taskCompletions').add({
      userId: currentUserFirebase.uid,
      taskTitle: title,
      amount: pay,
      completedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast(`+KES ${pay} earned!`);
    renderDashboardStats();
  };

  async function renderMyTools() {
    const list = document.getElementById('myToolsList');
    const msg = document.getElementById('myToolsMsg');
    if (!list) return;
    const purchased = currentUserData?.purchasedTools || [];
    if (purchased.length === 0) {
      msg.classList.remove('hidden');
      list.innerHTML = '';
      return;
    }
    msg.classList.add('hidden');
    const toolsSnap = await db.collection('tools').where(firebase.firestore.FieldPath.documentId(), 'in', purchased).get();
    list.innerHTML = '';
    toolsSnap.forEach(doc => {
      const t = doc.data();
      list.innerHTML += `
        <div class="bg-surface rounded-xl p-5 border border-accent/20 glow"><div class="flex items-center gap-3 mb-2"><i data-lucide="${t.icon}" style="width:20px;height:20px;color:${t.color};"></i><span class="font-medium">${t.name}</span></div><p class="text-slate text-xs">${t.desc}</p><button class="mt-3 px-4 py-2 rounded-lg bg-accent text-midnight text-sm font-semibold hover:bg-accentDim transition">Use Tool</button></div>
      `;
    });
    lucide.createIcons();
  }

  function setDashTab(tab) {
    dashTab = tab;
    document.querySelectorAll('.dash-content').forEach(c => c.classList.add('hidden'));
    document.getElementById('dash-' + tab)?.classList.remove('hidden');
    document.querySelectorAll('.dash-tab').forEach(t => {
      t.classList.toggle('bg-accent/10', t.dataset.tab === tab);
      t.classList.toggle('text-accent', t.dataset.tab === tab);
      t.classList.toggle('text-slate', t.dataset.tab !== tab);
    });
    if (tab === 'jobs') renderDashJobs();
    if (tab === 'tasks') renderDashTasks();
    if (tab === 'mytools') renderMyTools();
    if (tab === 'earnings') renderDashboardStats();
    lucide.createIcons();
  }
  window.setDashTab = setDashTab;

  // ---------------------- TOOLS MARKETPLACE ----------------------
  async function renderTools(filter) {
    const toolsSnap = await db.collection('tools').get();
    let filtered = toolsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    if (filter !== 'all') filtered = filtered.filter(t => t.cat === filter);
    const purchasedSet = new Set(currentUserData?.purchasedTools || []);
    const grid = document.getElementById('toolsGrid');
    if (!grid) return;
    grid.innerHTML = filtered.map(t => `
      <div class="bg-surface rounded-xl p-5 border border-white/5 card-hover cursor-pointer" onclick="openToolModal('${t.id}')">
        <div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background:${t.color}15"><i data-lucide="${t.icon}" style="width:20px;height:20px;color:${t.color};"></i></div><span class="font-heading font-semibold">${t.name}</span></div>
        <p class="text-slate text-sm mb-4">${t.desc}</p>
        <div class="flex justify-between items-center"><span class="font-heading font-bold text-accent">KES ${t.price.toLocaleString()}</span>${purchasedSet.has(t.id)?'<span class="tag bg-accent/10 text-accent">Owned</span>':'<span class="tag bg-white/5 text-slate">Preview</span>'}</div>
      </div>
    `).join('');
    lucide.createIcons();
  }
  window.filterTools = (cat) => renderTools(cat);
  window.openToolModal = async (id) => {
    currentToolId = id;
    const tDoc = await db.collection('tools').doc(id).get();
    const t = tDoc.data();
    document.getElementById('toolModalTitle').textContent = t.name;
    document.getElementById('toolModalDesc').textContent = t.desc;
    document.getElementById('toolModalDemoText').textContent = t.demo;
    document.getElementById('toolModalPrice').textContent = 'KES ' + t.price.toLocaleString();
    const owned = (currentUserData?.purchasedTools || []).includes(id);
    document.getElementById('toolModalUnlock').textContent = owned ? 'Already Owned' : 'Unlock Tool';
    document.getElementById('toolModalUnlock').disabled = owned;
    document.getElementById('toolModal').classList.remove('hidden');
    lucide.createIcons();
  };
  window.closeToolModal = () => document.getElementById('toolModal').classList.add('hidden');
  window.unlockTool = async () => {
    if (!currentToolId || !currentUserFirebase) return;
    const toolDoc = await db.collection('tools').doc(currentToolId).get();
    const tool = toolDoc.data();
    const price = tool.price;
    const userRef = db.collection('users').doc(currentUserFirebase.uid);
    await userRef.update({
      purchasedTools: firebase.firestore.FieldValue.arrayUnion(currentToolId)
    });
    // Optionally deduct balance? For now just grant tool
    showToast(`${tool.name} unlocked!`);
    closeToolModal();
    renderTools('all');
    renderMyTools();
  };

  // ---------------------- JOBS & APPLICATIONS ----------------------
  async function renderJobsList() {
    const container = document.getElementById('jobsList');
    if (!container) return;
    const jobsSnap = await db.collection('jobs').orderBy('createdAt', 'desc').get();
    container.innerHTML = '';
    jobsSnap.forEach(doc => {
      const j = doc.data();
      container.innerHTML += `
        <div class="bg-surface rounded-xl p-5 border border-white/5 card-hover">
          <div class="flex justify-between items-start mb-2 flex-wrap gap-2"><h3 class="font-heading font-semibold">${j.title}</h3><span class="text-accent font-bold">KES ${j.budget.toLocaleString()}</span></div>
          <p class="text-slate text-sm mb-3">${j.desc}</p>
          <div class="flex flex-wrap items-center gap-3 text-xs text-slate mb-3">
            <span class="flex items-center gap-1"><i data-lucide="user" style="width:12px;height:12px;"></i> ${j.clientName || 'Client'}</span>
            <span class="flex items-center gap-1"><i data-lucide="calendar" style="width:12px;height:12px;"></i> ${j.deadline}</span>
          </div>
          <div class="flex flex-wrap gap-2 mb-3">${(j.tags||[]).map(t=>`<span class="tag bg-white/5 text-slate">${t}</span>`).join('')}</div>
          <button onclick="openApplyJob('${doc.id}')" class="px-5 py-2 rounded-lg bg-accent text-midnight font-semibold text-sm hover:bg-accentDim transition">Apply Now</button>
        </div>
      `;
    });
    lucide.createIcons();
  }
  window.showPostJob = () => document.getElementById('postJobModal').classList.remove('hidden');
  window.closePostJob = () => document.getElementById('postJobModal').classList.add('hidden');
  window.submitJob = async (e) => {
    e.preventDefault();
    if (!currentUserFirebase) return;
    const title = document.getElementById('j-title').value;
    const desc = document.getElementById('j-desc').value;
    const budget = parseInt(document.getElementById('j-budget').value);
    const deadline = document.getElementById('j-deadline').value;
    await db.collection('jobs').add({
      title, desc, budget, deadline,
      clientId: currentUserFirebase.uid,
      clientName: currentUserData?.name || 'You',
      tags: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closePostJob();
    renderJobsList();
    showToast('Job posted!');
    e.target.reset();
  };
  window.openApplyJob = async (jobId) => {
    const jobDoc = await db.collection('jobs').doc(jobId).get();
    currentApplyJob = { id: jobDoc.id, ...jobDoc.data() };
    document.getElementById('applyJobTitle').textContent = currentApplyJob.title;
    document.getElementById('applyJobModal').classList.remove('hidden');
    lucide.createIcons();
  };
  window.closeApplyJob = () => document.getElementById('applyJobModal').classList.add('hidden');
  window.submitApplication = async (e) => {
    e.preventDefault();
    if (!currentUserFirebase || !currentApplyJob) return;
    const proposal = document.getElementById('a-proposal').value;
    const price = parseInt(document.getElementById('a-price').value);
    await db.collection('applications').add({
      jobId: currentApplyJob.id,
      freelancerId: currentUserFirebase.uid,
      freelancerName: currentUserData?.name,
      proposal,
      price,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeApplyJob();
    showToast('Application submitted!');
    e.target.reset();
  };

  // ---------------------- HELPER FUNCTIONS ----------------------
  function navigateTo(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('screen-' + screen);
    if (el) { el.classList.add('active'); currentScreen = screen; }
    window.scrollTo(0, 0);
    if (screen === 'onboarding') renderSkills();
    if (screen === 'dashboard') { renderDashboardStats(); setDashTab('overview'); lucide.createIcons(); }
    if (screen === 'tools') renderTools('all');
    if (screen === 'jobs') renderJobsList();
    lucide.createIcons();
  }
  function toggleMobileMenu() {
    const m = document.getElementById('mobileMenu');
    const b = document.getElementById('hamburgerBtn');
    m.classList.toggle('hidden');
    b.classList.toggle('menu-open');
  }
  function closeMobile() { document.getElementById('mobileMenu').classList.add('hidden'); }
  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.remove('hidden');
    if (isError) t.querySelector('i').setAttribute('data-lucide', 'alert-circle');
    lucide.createIcons();
    setTimeout(() => t.classList.add('hidden'), 3000);
  }
  window.toggleDashSidebar = () => {
    const s = document.getElementById('dashSidebar');
    s.classList.toggle('hidden');
    s.classList.toggle('fixed'); s.classList.toggle('z-30'); s.classList.toggle('top-16'); s.classList.toggle('left-0'); s.classList.toggle('bottom-0');
  };
  window.logout = async () => { await auth.signOut(); showToast('Logged out'); };

  // Append logout button to dashboard sidebar
  setTimeout(() => {
    const sidebar = document.querySelector('#dashSidebar');
    if (sidebar && !document.getElementById('logoutBtnSidebar')) {
      const btn = document.createElement('button');
      btn.id = 'logoutBtnSidebar';
      btn.className = 'w-full px-3 py-2.5 rounded-lg bg-red-500/10 text-red-400 text-sm font-medium hover:bg-red-500/20 transition flex items-center gap-2 mt-4';
      btn.innerHTML = '<i data-lucide="log-out" style="width:16px;height:16px;"></i> Logout';
      btn.onclick = () => logout();
      sidebar.appendChild(btn);
      lucide.createIcons();
    }
  }, 100);

  // ---------------------- INIT ----------------------
  window.onload = () => {
    seedFirestoreIfNeeded();
    lucide.createIcons();
    // attach event handlers globally
    window.handleSignup = handleSignup;
    window.handleLogin = handleLogin;
    window.handleGoogleSignup = handleGoogleSignup;
    window.navigateTo = navigateTo;
    window.toggleMobileMenu = toggleMobileMenu;
    window.closeMobile = closeMobile;
    window.logout = logout;
  };
</script>
</body>
</html>
