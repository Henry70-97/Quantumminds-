<!-- registration.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartHustle AI - Sign Up / Sign In</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyDm-PeCeRdlx6TKPEvKNdT93lMqb5D5O20",
      authDomain: "urbanpay-c5aee.firebaseapp.com",
      projectId: "urbanpay-c5aee",
      storageBucket: "urbanpay-c5aee.firebasestorage.app",
      messagingSenderId: "648155825006",
      appId: "1:648155825006:web:16d6ea4dfab808920b777f",
      measurementId: "G-CTKZN6VHPS"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    
    window.handleSignup = async (e) => {
      e.preventDefault();
      const name = document.getElementById('s-name').value;
      const email = document.getElementById('s-email').value;
      const phone = document.getElementById('s-phone').value;
      const yob = document.getElementById('s-yob').value;
      const nationality = document.getElementById('s-nation').value;
      const password = document.getElementById('s-pass').value;
      
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        // Create user profile in Firestore
        await setDoc(doc(db, "users", user.uid), {
          name: name,
          email: email,
          phone: phone,
          yearOfBirth: yob,
          nationality: nationality,
          role: "user",
          skills: [],
          purchasedTools: [],
          earnings: 0,
          createdAt: new Date().toISOString()
        });
        showToast("Account created successfully! Redirecting...");
        setTimeout(() => window.location.href = "user_dashboard.html", 1500);
      } catch (error) {
        showToast(error.message);
      }
    };
    
    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('l-email').value;
      const password = document.getElementById('l-pass').value;
      
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        // Check user role
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          const role = userDoc.data().role;
          if (role === "admin") {
            window.location.href = "admin_dashboard.html";
          } else {
            window.location.href = "user_dashboard.html";
          }
        } else {
          window.location.href = "user_dashboard.html";
        }
      } catch (error) {
        showToast(error.message);
      }
    };
    
    window.handleGoogleSignup = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        // Check if user exists in Firestore
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          // Create new user profile
          await setDoc(doc(db, "users", user.uid), {
            name: user.displayName || "Google User",
            email: user.email,
            phone: "",
            yearOfBirth: "",
            nationality: "",
            role: "user",
            skills: [],
            purchasedTools: [],
            earnings: 0,
            createdAt: new Date().toISOString()
          });
        }
        const role = userDoc.exists() ? userDoc.data().role : "user";
        if (role === "admin") {
          window.location.href = "admin_dashboard.html";
        } else {
          window.location.href = "user_dashboard.html";
        }
      } catch (error) {
        showToast(error.message);
      }
    };
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }
    
    window.showTab = (tab) => {
      document.getElementById('signup-form').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('border-accent', btn.dataset.tab === tab);
        btn.classList.toggle('text-accent', btn.dataset.tab === tab);
        btn.classList.toggle('border-white/10', btn.dataset.tab !== tab);
        btn.classList.toggle('text-slate', btn.dataset.tab !== tab);
      });
    };
    
    window.showTab('signup');
    lucide.createIcons();
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #0a0e1a; color: #ccd6f6; }
    .gradient-text { background: linear-gradient(135deg, #00e5a0, #00b4d8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .bg-grid { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0); background-size: 40px 40px; }
    input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px #00e5a0; }
  </style>
</head>
<body class="bg-midnight text-light bg-grid">
  <div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-4xl w-full">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 mb-4">
          <div class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center"><i data-lucide="zap" style="width:24px;height:24px;color:#0a0e1a;"></i></div>
          <span class="font-heading font-bold text-2xl">SmartHustle AI</span>
        </div>
        <h1 class="font-heading text-3xl md:text-4xl font-bold">Start Your <span class="gradient-text">Freelance Journey</span></h1>
        <p class="text-slate mt-2">Join thousands earning with AI-powered tools</p>
      </div>
      
      <div class="bg-surface rounded-2xl border border-white/10 p-6 md:p-8 shadow-xl">
        <div class="flex gap-2 border-b border-white/10 mb-6">
          <button data-tab="signup" onclick="showTab('signup')" class="tab-btn px-4 py-2 font-medium transition border-b-2 border-accent text-accent">Sign Up</button>
          <button data-tab="login" onclick="showTab('login')" class="tab-btn px-4 py-2 font-medium transition border-b-2 border-white/10 text-slate hover:text-light">Sign In</button>
        </div>
        
        <!-- Sign Up Form -->
        <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4">
          <div><label class="block text-sm font-medium mb-1">Full Name</label><input id="s-name" type="text" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="John Doe"></div>
          <div><label class="block text-sm font-medium mb-1">Email</label><input id="s-email" type="email" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="you@example.com"></div>
          <div><label class="block text-sm font-medium mb-1">Phone Number</label><input id="s-phone" type="tel" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="+254 700 000 000"></div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium mb-1">Year of Birth</label><input id="s-yob" type="number" min="1950" max="2010" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="1995"></div>
            <div><label class="block text-sm font-medium mb-1">Nationality</label><select id="s-nation" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light"><option value="">Select</option><option>Kenya</option><option>Nigeria</option><option>Tanzania</option><option>Uganda</option><option>South Africa</option><option>Ghana</option><option>Other</option></select></div>
          </div>
          <div><label class="block text-sm font-medium mb-1">Password</label><input id="s-pass" type="password" required minlength="6" class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="Min 6 characters"></div>
          <button type="submit" class="w-full py-3 rounded-xl bg-accent text-midnight font-bold hover:bg-accentDim transition">Create Account</button>
          <div class="relative my-4"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div><div class="relative flex justify-center text-xs text-slate"><span class="bg-surface px-3">or</span></div></div>
          <button type="button" onclick="handleGoogleSignup()" class="w-full py-3 rounded-xl bg-midnight border border-white/10 text-light font-medium hover:bg-white/5 transition flex items-center justify-center gap-3"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google</button>
        </form>
        
        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 hidden">
          <div><label class="block text-sm font-medium mb-1">Email</label><input id="l-email" type="email" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="you@example.com"></div>
          <div><label class="block text-sm font-medium mb-1">Password</label><input id="l-pass" type="password" required class="w-full px-4 py-3 rounded-xl bg-midnight border border-white/10 text-light" placeholder="Your password"></div>
          <button type="submit" class="w-full py-3 rounded-xl bg-accent text-midnight font-bold hover:bg-accentDim transition">Sign In</button>
          <p class="text-center text-slate text-sm">Don't have an account? <a href="#" onclick="showTab('signup');return false" class="text-accent hover:underline">Sign Up</a></p>
        </form>
      </div>
    </div>
  </div>
  <div id="toast" class="fixed top-20 right-4 z-50 hidden"><div class="bg-surface border border-accent/30 rounded-xl px-5 py-3 shadow-lg flex items-center gap-3"><i data-lucide="check-circle" style="width:18px;height:18px;color:#00e5a0;"></i> <span id="toastMsg" class="text-sm"></span></div></div>
  <script>lucide.createIcons();</script>
</body>
</html>
